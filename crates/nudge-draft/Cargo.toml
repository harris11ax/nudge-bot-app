[package]
name = "nudge-draft"
version.workspace = true
edition.workspace = true

[dependencies]
nudge-core = { path = "../nudge-core" }
# LLM producer: blocking HTTPS to the Anthropic Messages API. Unlike the svc's
# AW bridge (localhost, no TLS), this reaches api.anthropic.com, so the `tls`
# feature (rustls) is required in addition to `json`. Still no async runtime —
# same single-thread, no-tokio discipline as the rest of the workspace.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_System_SystemInformation",
] }

[[bin]]
name = "nudge-draft"
path = "src/main.rs"
